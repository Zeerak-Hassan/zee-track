name: Build offline Android APK
on:
  push:
    branches: ['codex/android-offline-apk']
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Gradle distribution
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          EXPECTED=$(curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256)
          echo "$EXPECTED  /tmp/gradle.zip" | sha256sum --check
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build release and test APKs
        working-directory: android-app
        run: /tmp/gradle-8.9/bin/gradle --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest lintRelease
      - name: Bundle APK and signing utility
        run: |
          mkdir -p apk-artifact
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk apk-artifact/Logbook-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apk-artifact/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: logbook-unsigned-apk
          path: apk-artifact/
          retention-days: 7
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test offline launch and persistent workouts on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: android-app
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            /tmp/gradle-8.9/bin/gradle --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/app.zeerak.logbook/files/offline-workout.png ../apk-artifact/offline-workout.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            android-app/app/build/reports/
            android-app/app/build/outputs/androidTest-results/
            apk-artifact/offline-workout.png
          retention-days: 7
